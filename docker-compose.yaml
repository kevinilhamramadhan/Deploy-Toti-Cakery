name: toticakery
configs:
  ollama_entrypoint:
    file: ./model/ollama-entrypoint.sh
  ollama_modelfile:
    file: ./model/Modelfile.qwen3-1.7b-v5
  ollama_modelfile_v6:
    file: ./model/Modelfile.qwen3-1.7b-v6
  ollama_modelfile_v6b:
    file: ./model/Modelfile.qwen3-1.7b-v6b
  ollama_modelfile_v7:
    file: ./model/Modelfile.qwen3-1.7b-v7
  ollama_modelfile_v8:
    file: ./model/Modelfile.qwen3-1.7b-v8
  ollama_modelfile_v9:
    file: ./model/Modelfile.qwen3-1.7b-v9

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Data ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    labels:
      # WUD: pantau digest tag 16-alpine (rilis patch 16.x), jangan menawarkan
      # tag lain -- tanpa ini yang ditawarkan "19beta4-trixie".
      wud.tag.include: ^16-alpine$
      wud.watch.digest: "true"
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-toti}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toti} -d ${POSTGRES_DB:-toti}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/nicholl2/backend-cakery:latest}
    pull_policy: always
    labels:
      # Diperbarui otomatis oleh WUD -- lihat blok wud di bawah.
      wud.trigger.include: docker.local,smtp.email
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-toti}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toti}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY wajib diisi di .env}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY wajib diisi di .env}
      CHATBOT_URL: http://chatbot-service:8000
      CHATBOT_INTERNAL_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY wajib diisi di .env}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CHATBOT_WA_NUMBER: ${CHATBOT_WA_NUMBER:?CHATBOT_WA_NUMBER wajib diisi di .env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - be_static:/app/static
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (React + nginx) ──────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/azpdschool/toti-cakery-fe:latest}
    pull_policy: always
    labels:
      # Diperbarui otomatis oleh WUD -- lihat blok wud di bawah.
      wud.trigger.include: docker.local,smtp.email
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend

  # ── LLM lokal ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-toti-qwen-1.7b-v9}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      LLM_HF_REF: ${LLM_HF_REF:-hf.co/LasagnaS/toti-qwen-1.7b-v9-gguf:Q4_K_M}
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_models:/root/.ollama
    configs:

      - source: ollama_entrypoint
        target: /entrypoint.sh
      - source: ollama_modelfile
        target: /modelfiles/Modelfile.qwen3-1.7b-v5
      # Kedua versi disediakan sekaligus: entrypoint memilih berdasarkan akhiran
      # LLM_MODEL, jadi ganti versi cukup dengan mengubah satu baris di .env dan
      # kembali ke v5 tidak perlu menyentuh compose lagi.
      - source: ollama_modelfile_v6
        target: /modelfiles/Modelfile.qwen3-1.7b-v6
      - source: ollama_modelfile_v6b
        target: /modelfiles/Modelfile.qwen3-1.7b-v6b
      - source: ollama_modelfile_v7
        target: /modelfiles/Modelfile.qwen3-1.7b-v7
      - source: ollama_modelfile_v8
        target: /modelfiles/Modelfile.qwen3-1.7b-v8
      - source: ollama_modelfile_v9
        target: /modelfiles/Modelfile.qwen3-1.7b-v9
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s

  # ── Gateway WhatsApp ──────────────────────────────────────────────────────
  # Penjaga pintu: wwebjs-api membuka Chromium ke web.whatsapp.com BEGITU
  # prosesnya hidup. Sesudah VM di-boot DNS-nya sering belum siap saat itu, dan
  # Chromium gagal dengan net::ERR_NAME_NOT_RESOLVED. Sesi baru pulih setelah
  # beberapa siklus ulang -- terukur 24 Sep 2026: ±15 menit tanpa satu pun pesan
  # WhatsApp bisa masuk, sementara `docker ps` tetap menulis "healthy" karena
  # start_period healthcheck-nya belum habis.
  #
  # Penantiannya ditaruh DI DALAM container, bukan sebagai service terpisah
  # dengan depends_on: sesudah VM di-boot yang menghidupkan container bukan
  # compose melainkan dockerd lewat `restart: unless-stopped`, dan dockerd tidak
  # mengenal depends_on sama sekali. Penjaga di luar cuma berlaku saat
  # `docker compose up` diketik manual -- yaitu justru saat masalahnya tidak ada.
  wwebjs-api:
    image: avoylenko/wwebjs-api:latest
    labels:
      # Diperbarui otomatis oleh WUD -- lihat blok wud di bawah.
      wud.trigger.include: docker.local,smtp.email
    restart: unless-stopped
    logging: *logging
    # ENTRYPOINT asli image: ["docker-entrypoint.sh"], CMD: ["npm","start"].
    # Keduanya dipanggil lagi di ujung skrip -- kalau image mengubahnya, samakan.
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until getent hosts web.whatsapp.com >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then
            echo "[dns] web.whatsapp.com belum resolve sesudah 60 detik -- jalan terus"
            break
          fi
          sleep 1
        done
        echo "[dns] tunggu $$i detik, gateway dijalankan"
        exec docker-entrypoint.sh npm start
    environment:
      ENABLE_WEBHOOK: "true"
      BASE_WEBHOOK_URL: http://chatbot-service:8000/webhook/whatsapp/${WEBHOOK_TOKEN:?WEBHOOK_TOKEN wajib diisi di .env}
      API_KEY: ${WWEBJS_API_KEY:?WWEBJS_API_KEY wajib diisi di .env}
      # Dibaca healthcheck di bawah. Harus sama dengan WWEBJS_SESSION_ID yang
      # dipakai chatbot-service, kalau tidak healthcheck memeriksa sesi lain.
      SESSION_ID: ${WWEBJS_SESSION_ID:-toti}
      DISABLED_CALLBACKS: "message_create|message_revoke_everyone|message_reaction|media|group_join|group_leave|call"
    volumes:
      - wwebjs_sessions:/usr/src/app/sessions
    # Healthcheck memeriksa SESI-nya, bukan cuma /ping. Gateway menjawab /ping
    # dengan 200 selama proses Node-nya hidup — termasuk saat sesi WhatsApp-nya
    # gagal diinisialisasi dan nol pesan bisa masuk. Selama healthcheck-nya cuma
    # /ping, `docker ps` menulis "healthy" untuk gateway yang sebenarnya mati.
    #
    # Ini penanda, bukan obat: compose tidak me-restart container yang unhealthy.
    # Yang menyembuhkan adalah chatbot-service, yang memeriksa sesi tiap siklus
    # dan menyalakannya lagi kalau mati (app/conversation/background.py).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const k=process.env.API_KEY,s=process.env.SESSION_ID||'toti';require('http').get({host:'127.0.0.1',port:3000,path:'/session/status/'+s,headers:{'x-api-key':k}},r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>process.exit(/\\\"state\\\":\\\"CONNECTED\\\"/.test(b)?0:1))}).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 15s
      retries: 3
      # Sesi butuh waktu membuka Chromium dan memulihkan kredensialnya; selama
      # start_period kegagalan tidak dihitung sebagai unhealthy.
      start_period: 180s
    shm_size: 512m

  # ── Chatbot ───────────────────────────────────────────────────────────────
  # ── Ingest FAQ ke ChromaDB (one-shot) ─────────────────────────────────────
  chatbot-ingest:
    image: ${CHATBOT_IMAGE:-ghcr.io/kevinilhamramadhan/chatbot-cakery:latest}
    pull_policy: always
    restart: "no"
    logging: *logging
    # Tanpa env_file: .env, sama seperti chatbot-service. Selain menjauhkan
    # POSTGRES_PASSWORD dan SECRET_KEY yang bukan urusannya, ini menutup celah
    # yang lebih halus: ingest MENULIS vektor dan chatbot-service MEMBACANYA,
    # jadi keduanya wajib memakai model embedding dan parameter chunk yang sama.
    # Selama satu sisi membaca .env dan sisi lain tidak, keduanya bisa berbeda
    # diam-diam dan hasil pencariannya jadi kacau tanpa error.
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      CHROMA_PERSIST_DIR: /app/chroma_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INGEST_WAIT_TIMEOUT_SECONDS: ${INGEST_WAIT_TIMEOUT_SECONDS:-1800}
      # Sumber FAQ adalah CRUD /faq di backend (yang disunting admin lewat Admin
      # Site); berkas .txt di dalam image cuma cadangan. Tanpa dua baris ini,
      # ingest memakai alamat backend bawaan yang tidak ada di sini, gagal
      # diam-diam, lalu meng-embed cadangan itu — dan chatbot menjawab dari FAQ
      # yang berbeda dengan yang dilihat admin.
      BACKEND_BASE_URL: http://backend:8000/api
      BACKEND_SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY wajib diisi di .env}
    volumes:
      - chroma_data:/app/chroma_db
    command: ["python", "knowledge_base/ingest.py", "--boot"]
    healthcheck:
      disable: true
    depends_on:
      ollama:
        condition: service_healthy

  chatbot-service:
    image: ${CHATBOT_IMAGE:-ghcr.io/kevinilhamramadhan/chatbot-cakery:latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    labels:
      # Diperbarui otomatis oleh WUD -- lihat blok wud di bawah.
      wud.trigger.include: docker.local,smtp.email
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WWEBJS_BASE_URL: http://wwebjs-api:3000
      OLLAMA_BASE_URL: http://ollama:11434
      # Menyertakan /api dengan sengaja. Backend berjalan dengan
      # root_path="/api", dan mount /static-nya HANYA menjawab di
      # /api/static/... -- tanpa prefiks ini chatbot menyusun URL foto
      # produk yang selalu 404, lalu melewatkan gambarnya diam-diam.
      BACKEND_BASE_URL: http://backend:8000/api

      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?WEBHOOK_TOKEN wajib diisi di .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY wajib diisi di .env}
      WWEBJS_API_KEY: ${WWEBJS_API_KEY:?WWEBJS_API_KEY wajib diisi di .env}
      BACKEND_SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY wajib diisi di .env}

      OWNER_WA_NUMBERS: ${OWNER_WA_NUMBERS:-}
      STORE_NAME: ${STORE_NAME:-Toti Cakery}
      STORE_ADDRESS: ${STORE_ADDRESS:-alamat belum diisi di .env}
      # Alamat tindak lanjut keluhan. Kosong = balasan keluhan tidak menyebut
      # email sama sekali, bukan menyebut alamat karangan.
      STORE_SUPPORT_EMAIL: ${STORE_SUPPORT_EMAIL:-}

      LLM_MODEL: ${LLM_MODEL:-toti-qwen-1.7b-v9}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MESSAGE_BODIES: ${LOG_MESSAGE_BODIES:-false}
      FAQ_REFRESH_SECONDS: ${FAQ_REFRESH_SECONDS:-900}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-192}
      # Parameter sampling yang BERLAKU, satu-satunya tempat menyetelnya.
      # chatbot-service mengirim temperature/top_p/num_ctx/num_predict di setiap
      # panggilan (app/llm/client.py), jadi nilai yang sama di Modelfile selalu
      # kalah dan sudah dibuang dari sana. 0,3 bukan 0,7: pada 0,7 model 1,7B
      # Q4 ini menjawab sapaan Indonesia dengan bahasa Inggris (2 dari 12) dan
      # sesekali mengarang kata ("Sejahtor"); pada 0,3 12 dari 12 wajar.
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TOP_P: ${LLM_TOP_P:-0.8}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      WARMUP_ON_STARTUP: ${WARMUP_ON_STARTUP:-true}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.40}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      PAYMENT_TIMEOUT_MINUTES: ${PAYMENT_TIMEOUT_MINUTES:-30}
      ALLOW_DOWN_PAYMENT: ${ALLOW_DOWN_PAYMENT:-true}
      DOWN_PAYMENT_PERCENTAGE: ${DOWN_PAYMENT_PERCENTAGE:-0.50}
      TAKEOVER_EXPIRY_DAYS: ${TAKEOVER_EXPIRY_DAYS:-1}
      WA_VERIFICATION_ENABLED: ${WA_VERIFICATION_ENABLED:-false}

      CHROMA_PERSIST_DIR: /app/chroma_db
      DATABASE_URL: sqlite+aiosqlite:////app/data/toti_chatbot.db
    volumes:
      - chatbot_data:/app/data
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      wwebjs-api:
        condition: service_started
      ollama:
        condition: service_started
      backend:
        condition: service_started
      chatbot-ingest:
        condition: service_completed_successfully

  # ── Jalan masuk dari internet ─────────────────────────────────────────────
  cloudflared-init:
    image: alpine:3
    restart: "no"
    logging: *logging
    environment:
      TUNNEL_ID: ${TUNNEL_ID:?TUNNEL_ID wajib diisi di .env -- lihat .env.server}
      TUNNEL_CREDENTIALS_JSON: ${TUNNEL_CREDENTIALS_JSON:?TUNNEL_CREDENTIALS_JSON wajib diisi di .env}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME wajib diisi di .env, mis. toticakery.web.id}
    volumes:
      - cloudflared_conf:/etc/cloudflared
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        printf '%s' "$$TUNNEL_CREDENTIALS_JSON" > /etc/cloudflared/creds.json
        cat > /etc/cloudflared/config.yml <<EOF
        tunnel: $$TUNNEL_ID
        credentials-file: /etc/cloudflared/creds.json
        ingress:
          - hostname: $$PUBLIC_HOSTNAME
            service: http://frontend:80
          - service: http_status:404
        EOF
        # Image cloudflared jalan sebagai user 65532, BUKAN root. Berkas milik
        # root dengan mode 600 membuatnya "permission denied" lalu restart-loop
        # -- sudah pernah terjadi, jangan diulang. Kepemilikannya yang
        # dipindahkan, bukan izinnya yang dilonggarkan.
        chown 65532:65532 /etc/cloudflared/creds.json /etc/cloudflared/config.yml
        chmod 600 /etc/cloudflared/creds.json
        echo "[tunnel] config siap: $$PUBLIC_HOSTNAME -> http://frontend:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    labels:
      # Diperbarui otomatis oleh WUD -- lihat blok wud di bawah.
      wud.trigger.include: docker.local,smtp.email
    restart: unless-stopped
    logging: *logging
    command: ["--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "tunnel", "run"]
    volumes:
      - cloudflared_conf:/etc/cloudflared:ro
    depends_on:
      cloudflared-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started

  # ── Pembaruan otomatis (CD) ───────────────────────────────────────────────
  # Paruh kedua dari CI di ketiga repo kode: CI mendorong image baru ke GHCR
  # sebagai :latest, WUD (What's Up Docker) yang menariknya ke sini. WUD memantau
  # SEMUA container yang sedang jalan tiap 20 menit (digest tag-nya di registry);
  # begitu berubah, trigger docker menarik image baru dan merekreasi container
  # dengan konfigurasi yang sama, dan trigger email mengabari. Berbasis polling,
  # jadi tidak ada port masuk dan tidak ada secret di GitHub.
  #
  # Yang diperbarui OTOMATIS:
  #   backend, frontend, chatbot-service  -> setiap merge ke main sampai ke
  #                                          produksi dalam <= 20 menit.
  #   wwebjs-api                          -> WhatsApp Web berubah tanpa aba-aba;
  #                                          26 Sep 2026 image lama menolak semua
  #                                          kiriman foto sampai ditarik ulang.
  #   cloudflared                         -> tunnel putus sebentar saja.
  # Yang HANYA dikabari (tanpa label wud.trigger.include):
  #   postgres  -> restart basis data sebaiknya disengaja.
  #   ollama    -> image ±9 GB, dan restart membuat cache prompt dingin (giliran
  #                pertama tiap bahasa ±55 detik sampai chatbot di-restart).
  #   wud       -> tidak bisa mengganti dirinya sendiri dengan aman.
  #
  # 20 menit, bukan 5: postgres, ollama, wwebjs-api, dan cloudflared ada di
  # Docker Hub, yang membatasi 100 permintaan manifest per 6 jam per IP tanpa
  # login. Empat image x 3 cek/jam x 6 jam = 72. Pada 5 menit angkanya 288, dan
  # blokir 429 dari Docker Hub juga menggagalkan `docker pull` biasa di mesin ini.
  #
  # Container yang sudah selesai (chatbot-ingest, cloudflared-init) tidak
  # dipantau. Kalau berkas FAQ berubah: docker compose up -d chatbot-ingest
  #
  # Trigger docker, bukan dockercompose: dockercompose hanya menambahkan langkah
  # menulis ulang tag di berkas compose, yang tidak berguna untuk :latest, dan
  # mencocokkan service lewat string image -- sedangkan image di sini berbentuk
  # ${BACKEND_IMAGE:-...}. Container hasil rekreasi tetap membawa label compose,
  # jadi `docker compose ps` dan `up -d` berikutnya masih mengenalinya.
  #
  # Web UI-nya hanya di loopback dan TIDAK dirutekan lewat cloudflared: WUD
  # memegang docker.sock, jadi akses ke UI-nya setara akses root ke mesin ini.
  # Buka dari laptop lewat SSH tunnel:  ssh -L 3001:127.0.0.1:3001 <vm>
  wud:
    image: getwud/wud:9
    labels:
      # Sama seperti postgres: hanya digest tag 9, bukan nama branch acak.
      wud.tag.include: ^9$
      wud.watch.digest: "true"
    restart: unless-stopped
    logging: *logging
    environment:
      WUD_WATCHER_LOCAL_CRON: "*/20 * * * *"
      # Node mencoba tiap alamat IP hanya 250 ms (happy eyeballs); dari jaringan
      # VM ini jabat tangan ke registry-1.docker.io lebih lambat dari itu, jadi
      # semua alamat gagal ETIMEDOUT dan keempat image Docker Hub tidak pernah
      # terpantau (terukur 26 Sep 2026). GHCR tidak terpengaruh.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
      # Docker Hub bawaannya tidak memantau digest; tag seperti 16-alpine dan
      # latest hanya bisa diketahui berubah lewat digest-nya.
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "true"
      WUD_TRIGGER_DOCKER_LOCAL_PRUNE: "true"
      # Pembaruan otomatis hanya untuk container berlabel
      # wud.trigger.include=docker.local. Label itu sekaligus daftar lengkap
      # trigger-nya, jadi smtp.email ikut ditulis di sana; container tanpa label
      # tetap mendapat email karena trigger email include-by-default.
      WUD_TRIGGER_DOCKER_LOCAL_INCLUDEBYDEFAULT: "false"
      # Autentikasi UI wajib: WUD menolak start tanpa akun admin.
      WUD_AUTH_ADMIN_USER: admin
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD:?WUD_ADMIN_PASSWORD wajib diisi di .env}
      # Email tiap kali versi baru terdeteksi (dan langsung dipasang). Opsional.
      # Tanpa nilai, variabel diteruskan apa adanya dari .env -- sengaja, karena
      # repo ini publik dan alamat email tidak boleh ikut ter-commit. Kalau
      # baris-baris ini tidak ada di .env, trigger email tidak terdaftar sama
      # sekali dan WUD tetap jalan. Contoh isinya di .env.server.
      WUD_TRIGGER_SMTP_EMAIL_HOST:
      WUD_TRIGGER_SMTP_EMAIL_PORT:
      WUD_TRIGGER_SMTP_EMAIL_TLS_ENABLED:
      WUD_TRIGGER_SMTP_EMAIL_USER:
      WUD_TRIGGER_SMTP_EMAIL_PASS:
      WUD_TRIGGER_SMTP_EMAIL_FROM_ADDRESS:
      WUD_TRIGGER_SMTP_EMAIL_TO:
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud_store:/store

volumes:
  db_data:        
  be_static:      
  ollama_models:  
  chatbot_data:   
  wwebjs_sessions:  
  chroma_data:      
  cloudflared_conf: 
  wud_store:
